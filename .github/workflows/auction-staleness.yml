name: Auction Data Staleness Check
# Flags county auction feeds that would render a blank or misleading dashboard:
# stale scrapes (> 14 days old), empty upcoming placeholders, or corrupt indexes.
# Alert-only — there is no auto-refresh workflow yet; a non-zero exit surfaces the
# failure in the Actions tab so a human (or the control-plane) can re-run scrapers.

on:
  schedule:
    - cron: '0 13 * * 1,4'   # Mon & Thu 13:00 UTC — roughly weekly cadence
  workflow_dispatch:          # Allow manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Check auction data staleness
        run: node web/scripts/check-auction-staleness.mjs
