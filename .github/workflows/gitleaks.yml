name: gitleaks
on: [push, pull_request]
# Explicit token permissions: the repo went private (2026-07-17), which
# restricts the default GITHUB_TOKEN — without pull-requests:read the
# action's PR-event run 403s on GET /pulls/N/commits.
permissions:
  contents: read
  pull-requests: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # Pinned to a full commit SHA (supply-chain hardening) instead of the
      # mutable @v2 tag. ff98106 is what @v2 currently resolves to (= v2.3.9).
      # To upgrade, bump the SHA + comment deliberately after reviewing the diff.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # gitleaks-action@v2 requires GITHUB_TOKEN to scan pull_request events
          # (without it the PR-triggered run errors out). The auto-provisioned
          # token is sufficient for same-repo PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
